# model defaults
name: delta         # which model to use
activation: "tanh"  # as per our pilots, this outperforms other activation functions
per_subject: true   # should models be individual?
rank: 5             # rank of our LoRAs

# encoder setup
encoder:
  enable: true
  layers: [150, 50, 25]
  activation: ${model.activation}
  dropout: 0.2

# latent setup 
latent:
  enable: true
  layers:
    layer1:
      type: "lora"
      linear:
        dropout: 0.2
        activation: ${model.activation}
      lora:
        per_subject: ${model.per_subject}
        dropout: 0.2
        alpha: 16.0
        rank: ${model.rank}

# decoder setup
decoder:
  enable: true
  layers: [25, 50, 150]
  activation: ${model.activation}
  dropout: 0.2

# attention setup
attention:
  enable: false
  latent: false
  type: "self"
  hidden: 10
  dropout: 0.2
  deactivate: 0.2
  Q:
    type: "lora"
    linear:
      dropout: 0.0
      activation: "identity"
    lora:
      per_subject: ${model.per_subject}
      dropout: 0.0
      alpha: 16.0
      rank: ${model.rank}
  gate:
    type: "lora"
    linear:
      dropout: 0.2
      activation: ${model.activation}
    lora:
      per_subject: ${model.per_subject}
      dropout: 0.2
      alpha: 16.0
      rank: ${model.rank}

# training setup
training:
  batch_size: 512
  #batch_size: 4096
  epochs: 500
  patience:
    wait: 25
    burn_in: 250
  denoising:
    enable: true
    sigma_X: 2.5e-1
    sigma_C: 1.0e-1
  optimiser:
    lr: 1e-3
    decay: 1e-4
  loss:
    geometrical:
      lam: 1e-0
      rms: false
      type: "mse"
      ceiling: false
    delta:
      lam: 0.0
    attention:
      lam: 1e-1