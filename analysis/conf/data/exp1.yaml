# data specification
path: "./data/ds-exp1/"         # bids root path
resources: "./data/resources/"  # resource path

bids:
  validate: True              # run bids validation?
  cache_file: ".pybids_cache" # what database cache to use?
  cache_reset: True           # should we reset database?

# subject filters to apply
filter:
  age:
    type: "range"
    var: "age"
    min: 18
    max: 100

# embeddings to use
embeddings: 
  models: ["glove"]
  #models: ["t5-large"]
  #models: ["e5-large"]
  #models: ["t5-large-context"]
  version: "raw"

# preprocessing steps to apply
preprocess:
  boards:
    demean: false  # demeans all boards to recentre them
    scale: false   # scales all boards such that the furthest item is exactly at the radius
  embeddings:
    svd: false       # performs SVD decomposition over training data
    rank: 50         # SVD rank, if applicable
    normalise: true  # applies an F.normalize to embeddings

# dataset descriptors (for bids generation)
dataset_descriptors:
  Name: "Semantic idiosyncracy (Experiment 1)"
  HEDVersion: "8.0.0"
  BIDSVersion: "1.10.0"
  DatasetType: "raw"
  License: ""
